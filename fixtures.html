<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>TDLM Fixtures & Results</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,Helvetica,sans-serif
}

body{
background:linear-gradient(180deg,#0b1224,#070b16);
color:#fff;
min-height:100vh;
padding-bottom:30px
}

header{
background:linear-gradient(145deg,#101d40,#0c142b);
padding:22px 15px;
text-align:center;
border-bottom:1px solid #24355f
}

header h1{
font-size:24px
}

header p{
font-size:11px;
color:#8190ae;
margin-top:5px
}

.brand{
color:#60a5fa!important;
font-weight:bold;
letter-spacing:3px
}

.container{
width:100%;
max-width:700px;
margin:auto;
padding:10px
}

.nav{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px;
margin-bottom:10px
}

.nav a{
text-align:center;
padding:13px 5px;
background:#111a30;
border:1px solid #293b5e;
border-radius:10px;
color:#fff;
text-decoration:none;
font-size:11px;
font-weight:bold
}

.panel{
background:linear-gradient(145deg,#111a2d,#0d1526);
border:1px solid #223354;
border-radius:14px;
padding:13px;
margin-bottom:10px
}

.panel h2{
font-size:16px;
margin-bottom:12px
}

select,input{
width:100%;
height:44px;
background:#080e1c;
color:#fff;
border:1px solid #2b3d60;
border-radius:9px;
padding:0 11px;
font-size:12px;
outline:none
}

.match{
background:#091223;
border:1px solid #223858;
border-left:3px solid #2563eb;
border-radius:11px;
padding:12px;
margin-bottom:8px
}

.match-date{
font-size:9px;
color:#7182a4;
margin-bottom:9px
}

.teams{
display:grid;
grid-template-columns:1fr 70px 1fr;
align-items:center;
gap:5px;
text-align:center
}

.team{
font-size:12px;
font-weight:bold
}

.score{
font-size:18px;
font-weight:900;
color:#60a5fa
}

.status{
font-size:8px;
color:#7182a4;
margin-top:5px
}

.result{
border-left-color:#16a34a
}

.round{
margin-top:16px;
margin-bottom:8px;
font-size:13px;
font-weight:bold;
color:#60a5fa
}

.admin{
display:none
}

button{
border:0;
border-radius:9px;
height:43px;
padding:0 13px;
font-size:11px;
font-weight:bold;
color:#fff;
cursor:pointer
}

.primary{
background:#2563eb
}

.success{
background:#16a34a
}

.danger{
background:#dc2626
}

.secondary{
background:#374151
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}

.empty{
text-align:center;
padding:25px;
font-size:11px;
color:#71809d
}

.modal{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
padding:15px;
background:rgba(0,0,0,.86);
z-index:999
}

.modal-box{
width:100%;
max-width:380px;
background:#111a2d;
border:1px solid #304568;
border-radius:15px;
padding:18px
}

.modal-box input{
margin-bottom:8px
}

@media(min-width:700px){

.container{
max-width:800px
}

}

</style>

</head>

<body>

<header>

<h1>⚽ TDLM</h1>

<p>Fixtures & Results</p>

<p class="brand">TRIXARQ</p>

</header>


<div class="container">


<div class="nav">

<a href="index.html">
🏆 League
</a>

<a href="register.html">
📝 Register
</a>

</div>


<div class="panel">

<select
id="league"
onchange="loadFixtures()">

<option>
Loading leagues...
</option>

</select>

</div>


<div
id="fixtures">

<div class="empty">
Loading fixtures...
</div>

</div>


<div class="panel">

<button
style="width:100%"
onclick="openLogin()">

🔐 Administrator — Enter Result

</button>

</div>


<div
class="admin"
id="adminPanel">

<div class="panel">

<h2>⚽ Enter Result</h2>

<select id="match">

<option>
Select fixture
</option>

</select>

<br><br>

<div class="grid">

<input
id="homeScore"
type="number"
min="0"
placeholder="Home score">

<input
id="awayScore"
type="number"
min="0"
placeholder="Away score">

</div>

<br>

<button
class="success"
style="width:100%"
onclick="saveResult()">

Save Result

</button>

<br><br>

<button
class="danger"
style="width:100%"
onclick="logout()">

Logout

</button>

</div>

</div>


</div>


<div
class="modal"
id="loginModal">

<div class="modal-box">

<h2>🔐 Administrator Login</h2>

<br>

<input
id="email"
type="email"
placeholder="Administrator email">

<input
id="password"
type="password"
placeholder="Password">

<button
class="primary"
style="width:100%"
onclick="login()">

Login

</button>

<br><br>

<button
class="secondary"
style="width:100%"
onclick="closeLogin()">

Cancel

</button>

</div>

</div>


<script>

const SUPABASE_URL=
"https://vhcfimwmoajnsxnpjyxa.supabase.co";

const SUPABASE_KEY=
"sb_publishable_WOw1puJqf0gBDrrEL-zXsg_aCcBgbJk";

const supabaseClient=
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let leagues=[];
let selectedLeague=null;
let matches=[];
let admin=false;


/* =========================
   LOAD LEAGUES
========================= */

async function loadLeagues(){

const {data,error}=
await supabaseClient
.from("leagues")
.select("*")
.order("id");

if(error)return;

leagues=data||[];

const select=
document.getElementById("league");

select.innerHTML="";

leagues.forEach(l=>{

const o=
document.createElement("option");

o.value=l.id;

o.textContent=
`${l.name} — ${l.season}`;

select.appendChild(o);

});

if(leagues.length){

selectedLeague=
leagues[0].id;

select.value=
selectedLeague;

await loadFixtures();

}

}


/* =========================
   LOAD FIXTURES
========================= */

async function loadFixtures(){

selectedLeague=
Number(
document.getElementById(
"league"
).value
);

const {data,error}=
await supabaseClient
.from("matches")
.select(`
*,
home:teams!matches_home_team_id_fkey(name),
away:teams!matches_away_team_id_fkey(name)
`)
.eq(
"league_id",
selectedLeague
)
.order(
"match_date",
{ascending:true}
);

if(error){

/*
 If your database relationship is
 using home_id/away_id instead,
 use the fallback query below.
*/

const {data:fallback}=
await supabaseClient
.from("matches")
.select("*")
.eq(
"league_id",
selectedLeague
)
.order(
"match_date",
{ascending:true}
);

matches=fallback||[];

await attachTeamNames();

}else{

matches=data||[];

}

renderFixtures();

populateMatchSelect();

}


/* =========================
   FALLBACK TEAM NAMES
========================= */

async function attachTeamNames(){

const {data:teams}=
await supabaseClient
.from("teams")
.select("id,name");

const map={};

(teams||[]).forEach(
t=>map[t.id]=t.name
);

matches.forEach(m=>{

m.home={
name:map[m.home_id]||"Unknown"
};

m.away={
name:map[m.away_id]||"Unknown"
};

});

}


/* =========================
   DISPLAY
========================= */

function renderFixtures(){

const box=
document.getElementById(
"fixtures"
);

box.innerHTML="";

if(!matches.length){

box.innerHTML=
`<div class="empty">
No fixtures have been generated yet.
</div>`;

return;

}


/*
 Create rounds based on
 fixture date.
*/

const groups={};

matches.forEach(m=>{

const date=
m.match_date||"TBD";

if(!groups[date])
groups[date]=[];

groups[date].push(m);

});


Object.keys(groups)
.sort()
.forEach((date,index)=>{

const title=
document.createElement("div");

title.className="round";

title.textContent=
`📅 Round ${index+1} — ${date}`;

box.appendChild(title);


groups[date].forEach(m=>{

const homeName=
m.home?.name||
"Unknown";

const awayName=
m.away?.name||
"Unknown";

const played=
m.home_score!==null &&
m.away_score!==null;

const div=
document.createElement("div");

div.className=
"match "+
(
played?"result":""
);

div.innerHTML=`

<div class="match-date">
${date}
</div>

<div class="teams">

<div class="team">
${esc(homeName)}
</div>

<div>

<div class="score">

${
played
?
`${m.home_score} - ${m.away_score}`
:
"VS"
}

</div>

<div class="status">

${
played
?
"RESULT"
:
"FIXTURE"
}

</div>

</div>

<div class="team">
${esc(awayName)}
</div>

</div>

`;

box.appendChild(div);

});

});

}


/* =========================
   MATCH SELECT
========================= */

function populateMatchSelect(){

const select=
document.getElementById("match");

select.innerHTML=
"<option value=''>Select fixture</option>";

matches
.filter(m=>
m.home_score===null ||
m.away_score===null
)
.forEach(m=>{

const option=
document.createElement("option");

option.value=m.id;

option.textContent=
`${m.home?.name||"Home"} vs ${m.away?.name||"Away"} — ${m.match_date}`;

select.appendChild(option);

});

}


/* =========================
   SAVE RESULT
========================= */

async function saveResult(){

if(!admin){

alert("Administrator login required.");

return;

}

const id=
Number(
document.getElementById(
"match"
).value
);

const home=
document.getElementById(
"homeScore"
).value;

const away=
document.getElementById(
"awayScore"
).value;

if(!id){

alert("Select a fixture.");

return;

}

if(home===""||away===""){

alert("Enter both scores.");

return;

}

const {error}=
await supabaseClient
.from("matches")
.update({

home_score:
Number(home),

away_score:
Number(away)

})
.eq("id",id);

if(error){

alert(error.message);

return;

}

document.getElementById(
"homeScore"
).value="";

document.getElementById(
"awayScore"
).value="";

await loadFixtures();

alert("Result saved.");

}


/* =========================
   LOGIN
========================= */

function openLogin(){

document.getElementById(
"loginModal"
).style.display="flex";

}

function closeLogin(){

document.getElementById(
"loginModal"
).style.display="none";

}

async function login(){

const email=
document.getElementById(
"email"
).value.trim();

const password=
document.getElementById(
"password"
).value;

const {error}=
await supabaseClient.auth
.signInWithPassword({
email,
password
});

if(error){

alert("Incorrect email or password.");

return;

}

admin=true;

closeLogin();

document.getElementById(
"adminPanel"
).style.display="block";

populateMatchSelect();

}


/* =========================
   LOGOUT
========================= */

async function logout(){

await supabaseClient.auth.signOut();

admin=false;

document.getElementById(
"adminPanel"
).style.display="none";

}


/* =========================
   ESCAPE
========================= */

function esc(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   AUTH CHECK
========================= */

async function checkAuth(){

const {data}=
await supabaseClient.auth
.getSession();

if(data.session){

admin=true;

document.getElementById(
"adminPanel"
).style.display="block";

}

}


/* =========================
   START
========================= */

async function start(){

await checkAuth();

await loadLeagues();

}

start();


/* =========================
   REALTIME
========================= */

supabaseClient
.channel("tdlm-fixtures")
.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"matches"
},
()=>loadFixtures()
)
.subscribe();

</script>

</body>

</html>
